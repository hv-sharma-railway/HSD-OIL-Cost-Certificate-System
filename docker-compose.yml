services:
  app:
    build: .
    ports:
      - "2997:3000"
    volumes:
      - railway-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/railway.db
    restart: always

  db-browser:
    image: coleifer/sqlite-web
    ports:
      - "2996:8080"
    volumes:
      - railway-data:/data
    entrypoint: ["sqlite-web", "-H", "0.0.0.0", "-p", "8080", "/data/railway.db"]
    restart: always

volumes:
  railway-data:
