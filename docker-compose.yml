version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - railway-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/railway.db
      # DSC_SIGNER_HOST defaults to host.docker.internal (Windows/Mac Docker Desktop)
      # On Linux Docker, set this to the actual host IP if host.docker.internal doesn't resolve
      - DSC_SIGNER_HOST=host.docker.internal
    extra_hosts:
      # Allows Docker container to reach the Windows host machine where DSC service runs
      - "host.docker.internal:host-gateway"
    restart: always

  db-browser:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - railway-data:/data
    command: /data/railway.db
    restart: always

volumes:
  railway-data:
